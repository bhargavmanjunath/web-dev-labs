<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
<meta charset="UTF-8">
<title>My First Web Page</title>
</head>
<body>
    <header>
        <h1>Hello, World</h1>
        <p>A student project for Web Development I</p>
    </header>

    <nav id="main-nav">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
</nav>

    <main>
        
        <div class="image-card">
        <img src="A photo for my web development page.jpg" alt="Web development project">
        <span class="new-badge">NEW</span>
    </div>

<table>
    <caption>My Course Schedule</caption>

    <thead>
        <tr>
            <th>Week</th>
            <th>Topic</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>4</td>
            <td>Advanced HTML</td>
        </tr>

        <tr>
            <td>5</td>
            <td>CSS</td>
        </tr>

        <tr>
            <td>6</td>
            <td>Flexbox</td>
        </tr>
    </tbody>
</table>

<form>

    <div class="form-row">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
    </div>

    <div class="form-row">
        <label for="zip">ZIP Code</label>
        <input type="text" id="zip" name="zip" pattern="^\d{5}$" required>
    </div>

    <div class="form-row">
        <label for="msg">Message</label>
        <textarea id="msg" name="msg"></textarea>
    </div>

    <div class="form-row">
        <label for="referral">How did you find this page?</label>
        <select id="referral" name="referral">
            <option value="search">Search engine</option>
            <option value="social">Social media</option>
            <option value="friend">A friend</option>
        </select>
    </div>

    <button type="submit">Send</button>

</form>

    </main>

    <footer>
        <p>&copy; 2026 Bhargav M</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
